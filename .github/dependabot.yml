version: 2
updates:
  # npm dependencies (package.json). Minor/patch are batched into a single
  # grouped PR — one CI run per week instead of one per package — and the
  # auto-merge workflow merges them once checks pass. Majors come as individual
  # PRs for manual review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "kornsour"
    labels:
      - "dependencies"
    groups:
      # @types/* packages are split out deliberately. Dependabot reports a
      # group's update-type as the HIGHEST across its members, and this package
      # carries companion type packages that lag behind their runtime package
      # (@types/jsonwebtoken was on 8 while jsonwebtoken was on 9). One such
      # major drags the whole group to semver-major, so the auto-merge workflow
      # routes the entire weekly batch to manual review and nothing merges
      # itself.
      #
      # Listed first because the first matching group wins; exclude-patterns on
      # the catch-all below makes the split explicit either way. A stale type
      # package now only blocks the types batch, never the runtime one.
      types-minor-patch:
        patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      npm-minor-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions pinned in workflows. Grouped so all action bumps arrive as one
  # PR, keeping CI runs (and minutes) to a minimum.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
